[project]
name = "mykrml-25728181"
version = "0.1.0"
description = "My wonderful convenient python package!"
readme = "README.md"
authors = [
    { name = "huyducv", email = "vuhuyduc03@gmail.com" }
]
requires-python = ">=3.12.11"
dependencies = [
    "pandas==2.2.2",
    "scikit-learn==1.5.1",
]

[project.scripts]
mykrml-25728181 = "mykrml_25728181:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab==4.2.3",
    "pytest==8.2.2",
]


[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
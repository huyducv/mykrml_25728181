[project]
name = "mykrml-25728181"
version = "0.2.0"
description = "Reusable helpers for a tabular machine learning workflow: cleaning, preprocessing pipelines and repeated cross-validation."
readme = "README.md"
authors = [
    { name = "huyducv", email = "vuhuyduc03@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27,<1",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.scripts]
mykrml-25728181 = "mykrml_25728181:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab==4.2.3",
    "pytest==8.2.2",
    "ruff==0.16.8",
]

[tool.ruff]
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]


[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
